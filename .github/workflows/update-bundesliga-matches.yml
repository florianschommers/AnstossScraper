name: Update Bundesliga Matches

on:
  schedule:
    # Täglich 21:30 UTC, vor dem allgemeinen Match-Lauf um 22:30 UTC.
    # Sonntag 03:00 UTC bleibt als zusätzlicher Lauf.
    - cron: '30 21 * * *'
    - cron: '0 3 * * 0'
  workflow_dispatch:  # Manuell auslösbar

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      
      - name: Install Dependencies
        run: |
          pip install requests
      
      - name: Update Match Data
        env:
          # Verwendet ANSTOSS_SCRAPER_TOKEN für Zugriff auf externes Repository
          GITHUB_TOKEN: ${{ secrets.ANSTOSS_SCRAPER_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python upload_matches_to_github.py

