name: Update Bundesliga Matches

on:
  schedule:
    # Alle 7 Tage, Sonntag 03:00 UTC (05:00 MESZ / 04:00 MEZ)
    # Eine Stunde nach "Scrape and publish data", damit sich die Pushes nicht beißen
    - cron: '0 3 * * 0'
  workflow_dispatch:  # Manuell auslösbar

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Dependencies
        run: |
          pip install requests
      
      - name: Update Match Data
        env:
          # Verwendet ANSTOSS_SCRAPER_TOKEN für Zugriff auf externes Repository
          GITHUB_TOKEN: ${{ secrets.ANSTOSS_SCRAPER_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python upload_matches_to_github.py

