name: Update Lineups

on:
  schedule:
    # GitHub legt die meisten geplanten Laeufe nie an. Ein einzelner Start
    # bleibt deshalb bis zu 5,5 Stunden aktiv und holt alle 15 Minuten neu.
    # Band 10:00-22:53 UTC.
    - cron: '8,23,38,53 10-22 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-lineups
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: main
          token: ${{ secrets.ANSTOSS_SCRAPER_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r scraper/requirements.txt

      - name: Aufstellungen alle 15 Minuten holen
        env:
          PUSH_TOKEN: ${{ secrets.ANSTOSS_SCRAPER_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          export TZ=UTC
          NOW=$(date +%s)
          WINDOW_START=$(date -d 'today 10:00:00' +%s)
          WINDOW_END=$(date -d 'today 22:53:00' +%s)
          MAX_RUN=$((NOW + 330 * 60))

          if [ "$NOW" -lt "$WINDOW_START" ] && [ "$WINDOW_START" -le "$MAX_RUN" ]; then
            WAIT=$((WINDOW_START - NOW))
            echo "Warte ${WAIT}s bis 10:00 UTC"
            sleep "$WAIT"
            NOW=$(date +%s)
          fi

          DEADLINE=$WINDOW_END
          if [ "$MAX_RUN" -lt "$DEADLINE" ]; then
            DEADLINE=$MAX_RUN
          fi
          if [ "$NOW" -ge "$WINDOW_END" ] || [ "$NOW" -lt "$WINDOW_START" ]; then
            DEADLINE=$NOW
          fi
          echo "Lauf aktiv bis $(date -u -d @$DEADLINE '+%Y-%m-%d %H:%M:%S UTC')"

          python - <<'PY'
          import json, os, urllib.request
          token = os.environ.get("GITHUB_TOKEN", "")
          repo = os.environ["GITHUB_REPOSITORY"]
          me = os.environ["GITHUB_RUN_ID"]
          if not token:
              raise SystemExit(0)
          url = f"https://api.github.com/repos/{repo}/actions/workflows/update-lineups.yml/runs?per_page=40"
          req = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "User-Agent": "anstoss-lineups",
          })
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  data = json.load(resp)
          except Exception as exc:
              print("Warteschlange nicht lesbar:", exc)
              data = {}
          for run in data.get("workflow_runs", []):
              if str(run.get("id")) == me:
                  continue
              if run.get("status") not in ("queued", "waiting", "pending", "requested"):
                  continue
              cancel = f"https://api.github.com/repos/{repo}/actions/runs/{run['id']}/cancel"
              creq = urllib.request.Request(cancel, data=b"", method="POST", headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "anstoss-lineups",
              })
              try:
                  urllib.request.urlopen(creq, timeout=30)
                  print("Wartenden Lauf beendet:", run["id"])
              except Exception as exc:
                  print("Beenden fehlgeschlagen:", run["id"], exc)
          PY

          commit_lineups() {
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"

            REPO_URL="https://${PUSH_TOKEN}@github.com/${{ github.repository }}.git"
            git remote set-url origin "$REPO_URL"

            echo "📦 Repository: ${{ github.repository }}"

            MAX_RETRIES=5
            RETRY_COUNT=0
            PULL_SUCCESS=false

            echo "💾 Prüfe auf uncommitted Änderungen..."
            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "📦 Stashe uncommitted Änderungen..."
              git stash push -m "Auto-stash before pull - $(date +'%Y-%m-%d %H:%M:%S UTC')" || true
              STASHED=true
            else
              STASHED=false
            fi

            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              echo "🔄 Git pull (Versuch $((RETRY_COUNT + 1))/$MAX_RETRIES)..."
              if git fetch origin main 2>&1; then
                echo "✅ Git fetch erfolgreich"
                if git rebase origin/main 2>&1; then
                  echo "✅ Git rebase erfolgreich"
                  PULL_SUCCESS=true
                  break
                elif git merge origin/main --no-edit 2>&1; then
                  echo "✅ Git merge erfolgreich"
                  PULL_SUCCESS=true
                  break
                else
                  echo "⚠️ Rebase/Merge fehlgeschlagen, versuche Reset..."
                  git reset --hard origin/main 2>&1 || true
                  PULL_SUCCESS=true
                  break
                fi
              else
                echo "⚠️ Git fetch fehlgeschlagen"
              fi
              RETRY_COUNT=$((RETRY_COUNT + 1))
              if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                WAIT_TIME=$((RETRY_COUNT * 3))
                echo "⏳ Warte ${WAIT_TIME}s vor erneutem Versuch..."
                sleep $WAIT_TIME
              fi
            done

            if [ "$STASHED" = true ]; then
              echo "📦 Wende gestashte Änderungen wieder an..."
              git stash pop 2>&1 || git stash list
            fi

            if [ "$PULL_SUCCESS" = false ]; then
              echo "❌ Git pull fehlgeschlagen nach $MAX_RETRIES Versuchen"
              echo "⚠️ Versuche trotzdem fortzufahren, aber Push könnte fehlschlagen..."
            fi

            mkdir -p data/lineups

            if ls data/lineups/*.json 1> /dev/null 2>&1; then
              echo "📁 Gefundene JSON-Dateien:"
              ls -lh data/lineups/*.json

              if git add data/lineups/*.json; then
                echo "✅ Dateien zu Git hinzugefügt"
                if ! git diff --staged --quiet; then
                  echo "📝 Committe Änderungen..."
                  git commit -m "Update lineup data - $(date +'%Y-%m-%d %H:%M:%S UTC')" || {
                    echo "⚠️ Commit fehlgeschlagen (möglicherweise keine Änderungen)"
                    return 0
                  }

                  RETRY_COUNT=0
                  PUSH_SUCCESS=false
                  MAX_PUSH_RETRIES=10

                  while [ $RETRY_COUNT -lt $MAX_PUSH_RETRIES ]; do
                    echo "🔄 Hole neueste Änderungen vor Push (Versuch $((RETRY_COUNT + 1))/$MAX_PUSH_RETRIES)..."
                    git fetch origin main 2>&1 || true
                    LOCAL_COMMITS=$(git rev-list HEAD...origin/main --count 2>/dev/null || echo "0")
                    if [ "$LOCAL_COMMITS" -gt 0 ]; then
                      echo "📝 Gefunden: $LOCAL_COMMITS lokale Commits, die nicht auf Remote sind"
                      if git rebase origin/main 2>&1; then
                        echo "✅ Rebase erfolgreich"
                      elif git merge origin/main --no-edit 2>&1; then
                        echo "✅ Merge erfolgreich"
                      else
                        if [ $RETRY_COUNT -lt $((MAX_PUSH_RETRIES - 1)) ]; then
                          echo "🔄 Reset auf origin/main und neu committen..."
                          git reset --hard origin/main 2>&1
                          git add data/lineups/*.json 2>&1
                          git commit -m "Update lineup data - $(date +'%Y-%m-%d %H:%M:%S UTC')" 2>&1
                        fi
                      fi
                    else
                      echo "ℹ️ Keine lokalen Commits, die nicht auf Remote sind"
                    fi

                    echo "🚀 Git push (Versuch $((RETRY_COUNT + 1))/$MAX_PUSH_RETRIES)..."
                    if [ $RETRY_COUNT -ge $((MAX_PUSH_RETRIES - 2)) ]; then
                      echo "ℹ️ Verwende --force-with-lease für finalen Push-Versuch"
                      PUSH_OUTPUT=$(git push origin HEAD:main --force-with-lease 2>&1)
                    else
                      PUSH_OUTPUT=$(git push origin HEAD:main 2>&1)
                    fi
                    PUSH_EXIT_CODE=$?

                    if [ $PUSH_EXIT_CODE -eq 0 ]; then
                      echo "✅ Git push erfolgreich"
                      PUSH_SUCCESS=true
                      break
                    else
                      echo "$PUSH_OUTPUT"
                      RETRY_COUNT=$((RETRY_COUNT + 1))
                      if [ $RETRY_COUNT -lt $MAX_PUSH_RETRIES ]; then
                        if echo "$PUSH_OUTPUT" | grep -q "rejected\|fetch first"; then
                          WAIT_TIME=$((RETRY_COUNT * 2))
                          echo "⚠️ Push abgelehnt - Remote hat neue Commits"
                          echo "⏳ Warte ${WAIT_TIME}s und hole dann neueste Änderungen..."
                          sleep $WAIT_TIME
                          git fetch origin main 2>&1
                          git rebase origin/main 2>&1 || git merge origin/main --no-edit 2>&1 || {
                            echo "🔄 Reset auf origin/main und neu committen..."
                            git reset --hard origin/main 2>&1
                            git add data/lineups/*.json 2>&1
                            git commit -m "Update lineup data - $(date +'%Y-%m-%d %H:%M:%S UTC')" 2>&1
                          }
                        else
                          WAIT_TIME=$((RETRY_COUNT * 3))
                          echo "⚠️ Push fehlgeschlagen, warte ${WAIT_TIME}s..."
                          sleep $WAIT_TIME
                        fi
                      fi
                    fi
                  done

                  if [ "$PUSH_SUCCESS" = false ]; then
                    echo "❌ Git push fehlgeschlagen nach $MAX_PUSH_RETRIES Versuchen"
                    echo "⚠️ Der nächste Workflow-Lauf wird es erneut versuchen"
                    return 0
                  fi
                else
                  echo "ℹ️ Keine Änderungen zum Committen"
                fi
              else
                echo "⚠️ Git add fehlgeschlagen"
                return 0
              fi
            else
              echo "ℹ️ Keine Lineup-JSON in data/lineups — in diesem Fenster keine Startelf"
              return 0
            fi

          }

          while true; do
            CYCLE_START=$(date +%s)
            echo "===== Durchlauf $(date -u '+%Y-%m-%d %H:%M:%S UTC') ====="
            python scraper/scrape_lineups.py || echo "Scraper-Fehler, der Lauf bleibt aktiv"
            commit_lineups || echo "Veroeffentlichen fehlgeschlagen, naechster Versuch folgt"
            NOW=$(date +%s)
            if [ "$NOW" -ge "$DEADLINE" ]; then
              echo "Zeitfenster oder Laufzeitlimit erreicht"
              break
            fi
            ELAPSED=$((NOW - CYCLE_START))
            SLEEP_FOR=$((900 - ELAPSED))
            if [ "$SLEEP_FOR" -lt 60 ]; then
              SLEEP_FOR=60
            fi
            if [ $((NOW + SLEEP_FOR)) -gt "$DEADLINE" ]; then
              echo "Naechster Durchlauf laege hinter dem Zeitfenster"
              break
            fi
            echo "Naechster Durchlauf in ${SLEEP_FOR}s"
            sleep "$SLEEP_FOR"
          done
