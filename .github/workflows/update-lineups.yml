name: Update Lineups

on:
  schedule:
    # GitHub legt die meisten geplanten Laeufe nie an. Jeder Lauf merkt
    # deshalb auf GitHub selbst den naechsten vor. Die Kette bleibt wochenlang
    # stehen, auch wenn kein Rechner an ist. Geholt wird 10:00-22:53 UTC.
    - cron: '8,23,38,53 10-22 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-lineups
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: main
          token: ${{ secrets.ANSTOSS_SCRAPER_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r scraper/requirements.txt

      - name: Aufstellungen alle 15 Minuten holen
        env:
          PUSH_TOKEN: ${{ secrets.ANSTOSS_SCRAPER_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          export TZ=UTC
          NOW=$(date +%s)
          WINDOW_START=$(date -d 'today 10:00:00' +%s)
          WINDOW_END=$(date -d 'today 22:53:00' +%s)
          if [ "$NOW" -ge "$WINDOW_END" ]; then
            WINDOW_START=$(date -d 'tomorrow 10:00:00' +%s)
            WINDOW_END=$(date -d 'tomorrow 22:53:00' +%s)
          fi

          cat > /tmp/ensure_successor.py << 'PY'
          import json, os, urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          me = os.environ["GITHUB_RUN_ID"]
          tokens = []
          for key in ("PUSH_TOKEN", "GITHUB_TOKEN"):
              value = os.environ.get(key, "").strip()
              if value and value not in tokens:
                  tokens.append(value)

          def request(method, url, token, body=None):
              data = None
              if method != "GET":
                  data = b"" if body is None else json.dumps(body).encode()
              req = urllib.request.Request(
                  url,
                  data=data,
                  method=method,
                  headers={
                      "Authorization": "Bearer " + token,
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "anstoss-lineups",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return resp.read().decode()

          def list_queued(token):
              url = (
                  "https://api.github.com/repos/"
                  + repo
                  + "/actions/workflows/update-lineups.yml/runs?per_page=40"
              )
              data = json.loads(request("GET", url, token) or "{}")
              found = []
              for run in data.get("workflow_runs", []):
                  if str(run.get("id")) == me:
                      continue
                  if run.get("status") in ("queued", "waiting", "pending", "requested"):
                      found.append(run)
              return found

          def cancel(token, run_id):
              url = "https://api.github.com/repos/" + repo + "/actions/runs/" + str(run_id) + "/cancel"
              request("POST", url, token)

          def dispatch(token):
              url = (
                  "https://api.github.com/repos/"
                  + repo
                  + "/actions/workflows/update-lineups.yml/dispatches"
              )
              request("POST", url, token, {"ref": "main"})

          if not tokens:
              raise SystemExit("kein Token")

          token = None
          queued = None
          errors = []
          for candidate in tokens:
              try:
                  queued = list_queued(candidate)
                  token = candidate
                  break
              except Exception as exc:
                  errors.append(str(exc))

          if token is None:
              print("Warteschlange nicht lesbar:", "; ".join(errors))
              raise SystemExit(1)

          queued.sort(key=lambda run: run.get("created_at") or "", reverse=True)
          for extra in queued[1:]:
              try:
                  cancel(token, extra["id"])
                  print("Zusaetzlichen Lauf beendet:", extra["id"])
              except Exception as exc:
                  print("Beenden fehlgeschlagen:", extra["id"], exc)

          if queued:
              print("Nachfolger wartet bereits:", queued[0]["id"])
              raise SystemExit(0)

          dispatched = False
          for candidate in tokens:
              try:
                  dispatch(candidate)
                  print("Nachfolger auf GitHub vorgemerkt")
                  dispatched = True
                  break
              except Exception as exc:
                  print("Nachfolger konnte nicht vorgemerkt werden:", exc)

          if not dispatched:
              raise SystemExit(1)
          PY
          python /tmp/ensure_successor.py || echo "Nachfolger noch nicht vorgemerkt"

          NOW=$(date +%s)
          MAX_HOLD=$((300 * 60))
          HOLD_UNTIL=$((NOW + MAX_HOLD))
          if [ "$NOW" -lt "$WINDOW_START" ]; then
            WAIT=$((WINDOW_START - NOW))
            if [ "$WAIT" -gt "$MAX_HOLD" ]; then
              WAIT=$MAX_HOLD
            fi
            echo "Ausserhalb des Zeitfensters, Kette bleibt ${WAIT}s aktiv"
            sleep "$WAIT"
            NOW=$(date +%s)
            if [ "$NOW" -lt "$WINDOW_START" ]; then
              echo "Zeitfenster beginnt spaeter, der naechste Lauf uebernimmt"
              exit 0
            fi
          fi

          DEADLINE=$WINDOW_END
          if [ "$HOLD_UNTIL" -lt "$DEADLINE" ]; then
            DEADLINE=$HOLD_UNTIL
          fi
          echo "Lauf aktiv bis $(date -u -d "@$DEADLINE" '+%Y-%m-%d %H:%M:%S UTC')"

          commit_lineups() {
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"

            REPO_URL="https://${PUSH_TOKEN}@github.com/${{ github.repository }}.git"
            git remote set-url origin "$REPO_URL"

            echo "📦 Repository: ${{ github.repository }}"

            MAX_RETRIES=5
            RETRY_COUNT=0
            PULL_SUCCESS=false

            echo "💾 Prüfe auf uncommitted Änderungen..."
            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "📦 Stashe uncommitted Änderungen..."
              git stash push -m "Auto-stash before pull - $(date +'%Y-%m-%d %H:%M:%S UTC')" || true
              STASHED=true
            else
              STASHED=false
            fi

            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              echo "🔄 Git pull (Versuch $((RETRY_COUNT + 1))/$MAX_RETRIES)..."
              if git fetch origin main 2>&1; then
                echo "✅ Git fetch erfolgreich"
                if git rebase origin/main 2>&1; then
                  echo "✅ Git rebase erfolgreich"
                  PULL_SUCCESS=true
                  break
                elif git merge origin/main --no-edit 2>&1; then
                  echo "✅ Git merge erfolgreich"
                  PULL_SUCCESS=true
                  break
                else
                  echo "⚠️ Rebase/Merge fehlgeschlagen, versuche Reset..."
                  git reset --hard origin/main 2>&1 || true
                  PULL_SUCCESS=true
                  break
                fi
              else
                echo "⚠️ Git fetch fehlgeschlagen"
              fi
              RETRY_COUNT=$((RETRY_COUNT + 1))
              if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                WAIT_TIME=$((RETRY_COUNT * 3))
                echo "⏳ Warte ${WAIT_TIME}s vor erneutem Versuch..."
                sleep $WAIT_TIME
              fi
            done

            if [ "$STASHED" = true ]; then
              echo "📦 Wende gestashte Änderungen wieder an..."
              git stash pop 2>&1 || git stash list
            fi

            if [ "$PULL_SUCCESS" = false ]; then
              echo "❌ Git pull fehlgeschlagen nach $MAX_RETRIES Versuchen"
              echo "⚠️ Versuche trotzdem fortzufahren, aber Push könnte fehlschlagen..."
            fi

            mkdir -p data/lineups

            if ls data/lineups/*.json 1> /dev/null 2>&1; then
              echo "📁 Gefundene JSON-Dateien:"
              ls -lh data/lineups/*.json

              if git add data/lineups/*.json; then
                echo "✅ Dateien zu Git hinzugefügt"
                if ! git diff --staged --quiet; then
                  echo "📝 Committe Änderungen..."
                  git commit -m "Update lineup data - $(date +'%Y-%m-%d %H:%M:%S UTC')" || {
                    echo "⚠️ Commit fehlgeschlagen (möglicherweise keine Änderungen)"
                    return 0
                  }

                  RETRY_COUNT=0
                  PUSH_SUCCESS=false
                  MAX_PUSH_RETRIES=10

                  while [ $RETRY_COUNT -lt $MAX_PUSH_RETRIES ]; do
                    echo "🔄 Hole neueste Änderungen vor Push (Versuch $((RETRY_COUNT + 1))/$MAX_PUSH_RETRIES)..."
                    git fetch origin main 2>&1 || true
                    LOCAL_COMMITS=$(git rev-list HEAD...origin/main --count 2>/dev/null || echo "0")
                    if [ "$LOCAL_COMMITS" -gt 0 ]; then
                      echo "📝 Gefunden: $LOCAL_COMMITS lokale Commits, die nicht auf Remote sind"
                      if git rebase origin/main 2>&1; then
                        echo "✅ Rebase erfolgreich"
                      elif git merge origin/main --no-edit 2>&1; then
                        echo "✅ Merge erfolgreich"
                      else
                        if [ $RETRY_COUNT -lt $((MAX_PUSH_RETRIES - 1)) ]; then
                          echo "🔄 Reset auf origin/main und neu committen..."
                          git reset --hard origin/main 2>&1
                          git add data/lineups/*.json 2>&1
                          git commit -m "Update lineup data - $(date +'%Y-%m-%d %H:%M:%S UTC')" 2>&1
                        fi
                      fi
                    else
                      echo "ℹ️ Keine lokalen Commits, die nicht auf Remote sind"
                    fi

                    echo "🚀 Git push (Versuch $((RETRY_COUNT + 1))/$MAX_PUSH_RETRIES)..."
                    if [ $RETRY_COUNT -ge $((MAX_PUSH_RETRIES - 2)) ]; then
                      echo "ℹ️ Verwende --force-with-lease für finalen Push-Versuch"
                      PUSH_OUTPUT=$(git push origin HEAD:main --force-with-lease 2>&1)
                    else
                      PUSH_OUTPUT=$(git push origin HEAD:main 2>&1)
                    fi
                    PUSH_EXIT_CODE=$?

                    if [ $PUSH_EXIT_CODE -eq 0 ]; then
                      echo "✅ Git push erfolgreich"
                      PUSH_SUCCESS=true
                      break
                    else
                      echo "$PUSH_OUTPUT"
                      RETRY_COUNT=$((RETRY_COUNT + 1))
                      if [ $RETRY_COUNT -lt $MAX_PUSH_RETRIES ]; then
                        if echo "$PUSH_OUTPUT" | grep -q "rejected\|fetch first"; then
                          WAIT_TIME=$((RETRY_COUNT * 2))
                          echo "⚠️ Push abgelehnt - Remote hat neue Commits"
                          echo "⏳ Warte ${WAIT_TIME}s und hole dann neueste Änderungen..."
                          sleep $WAIT_TIME
                          git fetch origin main 2>&1
                          git rebase origin/main 2>&1 || git merge origin/main --no-edit 2>&1 || {
                            echo "🔄 Reset auf origin/main und neu committen..."
                            git reset --hard origin/main 2>&1
                            git add data/lineups/*.json 2>&1
                            git commit -m "Update lineup data - $(date +'%Y-%m-%d %H:%M:%S UTC')" 2>&1
                          }
                        else
                          WAIT_TIME=$((RETRY_COUNT * 3))
                          echo "⚠️ Push fehlgeschlagen, warte ${WAIT_TIME}s..."
                          sleep $WAIT_TIME
                        fi
                      fi
                    fi
                  done

                  if [ "$PUSH_SUCCESS" = false ]; then
                    echo "❌ Git push fehlgeschlagen nach $MAX_PUSH_RETRIES Versuchen"
                    echo "⚠️ Der nächste Workflow-Lauf wird es erneut versuchen"
                    return 0
                  fi
                else
                  echo "ℹ️ Keine Änderungen zum Committen"
                fi
              else
                echo "⚠️ Git add fehlgeschlagen"
                return 0
              fi
            else
              echo "ℹ️ Keine Lineup-JSON in data/lineups — in diesem Fenster keine Startelf"
              return 0
            fi

          }

          while true; do
            CYCLE_START=$(date +%s)
            echo "===== Durchlauf $(date -u '+%Y-%m-%d %H:%M:%S UTC') ====="
            python scraper/scrape_lineups.py || echo "Scraper-Fehler, der Lauf bleibt aktiv"
            commit_lineups || echo "Veroeffentlichen fehlgeschlagen, naechster Versuch folgt"
            NOW=$(date +%s)
            if [ "$NOW" -ge "$DEADLINE" ]; then
              echo "Zeitfenster oder Laufzeitlimit erreicht"
              break
            fi
            ELAPSED=$((NOW - CYCLE_START))
            SLEEP_FOR=$((900 - ELAPSED))
            if [ "$SLEEP_FOR" -lt 60 ]; then
              SLEEP_FOR=60
            fi
            if [ $((NOW + SLEEP_FOR)) -gt "$DEADLINE" ]; then
              echo "Naechster Durchlauf laege hinter dem Zeitfenster"
              break
            fi
            echo "Naechster Durchlauf in ${SLEEP_FOR}s"
            sleep "$SLEEP_FOR"
          done
          python /tmp/ensure_successor.py || echo "Nachfolger am Ende nicht bestaetigt"
